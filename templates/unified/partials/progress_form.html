<form id="progressUpdateForm" onsubmit="submitProgressUpdate(event)">
    <input type="hidden" name="job_card_id" value="{{ job_card.id }}">
    
    <div class="mb-3">
        <h6>{{ job_card.job_card_number }} - {{ job_card.process_name }}</h6>
        <small class="text-muted">{{ job_card.item.name if job_card.item else 'Unknown Item' }}</small>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Completed Quantity</label>
            <input type="number" class="form-control" name="completed_quantity" 
                   value="{{ job_card.completed_quantity }}" step="0.1" min="0" 
                   max="{{ job_card.planned_quantity }}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Status</label>
            <select class="form-select" name="status" required>
                <option value="planned" {{ 'selected' if job_card.status == 'planned' }}>Planned</option>
                <option value="in_progress" {{ 'selected' if job_card.status == 'in_progress' }}>In Progress</option>
                <option value="completed" {{ 'selected' if job_card.status == 'completed' }}>Completed</option>
            </select>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Progress Notes</label>
        <textarea class="form-control" name="progress_notes" rows="3" 
                  placeholder="Add any notes about today's progress...">{{ job_card.progress_notes or '' }}</textarea>
    </div>

    {% if job_card.job_type == 'outsourced' and job_card.assigned_vendor %}
    <div class="mb-3">
        <div class="alert alert-info">
            <i class="fas fa-info-circle me-2"></i>
            <strong>Outsourced Job:</strong> Assigned to {{ job_card.assigned_vendor.name }}
        </div>
    </div>
    {% endif %}

    <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-2"></i>Update Progress
        </button>
    </div>
</form>

<script>
function submitProgressUpdate(event) {
    event.preventDefault();
    
    const form = event.target;
    const formData = new FormData(form);
    
    // Show loading state
    const submitBtn = form.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Updating...';
    submitBtn.disabled = true;
    
    fetch('/api/job-cards/update-progress', {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': document.querySelector('meta[name=csrf-token]')?.getAttribute('content') || ''
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Close modal and refresh the page
            bootstrap.Modal.getInstance(document.getElementById('progressModal')).hide();
            location.reload();
        } else {
            alert('Error updating progress: ' + (data.error || 'Unknown error'));
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Error updating progress. Please try again.');
    })
    .finally(() => {
        // Restore button state
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    });
}
</script>
